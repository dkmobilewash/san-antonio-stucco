name: SEO lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and prerender
        run: npm run build

      - name: SEO lint
        run: npm run seo:lint
